name: Hourly Kickbase Update

on:
  schedule:
    # Läuft einmal pro Stunde (zur vollen Stunde)
    - cron: '14 * * * *'
  workflow_dispatch: # Ermöglicht es dir, das Skript jederzeit manuell in GitHub zu starten

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Erlaubt das Zurückschreiben ins Repository
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Kickbase Script
        env:
          KB_USER: ${{ secrets.KICKBASE_EMAIL }}
          KB_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
        run: |
          python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Fügt neben den TXT-Dateien auch die neue HTML-Webseite hinzu
          git add *.txt index.html
          
          # Nur committen, wenn es tatsächlich Änderungen gab
          if git diff --cached --quiet; then
            echo "Keine Änderungen festgestellt."
          else
            git commit -m "Auto-Update: Kickbase Daten & Dashboard aktualisiert [skip ci]"
            git push
          fi