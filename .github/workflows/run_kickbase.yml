name: Hourly Kickbase Update

on:
  schedule:
    # Läuft einmal pro Stunde (zur 14. Minute)
    - cron: '14 * * * *'
  workflow_dispatch: # Ermöglicht manuellen Start

# HIER NEU: Explizite Schreibrechte für den GITHUB_TOKEN setzen
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Kickbase Script
        env:
          KB_USER: ${{ secrets.KICKBASE_EMAIL }}
          KB_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
        run: |
          python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Flexibleres Hinzufügen: Fügt alle modifizierten/neuen Dateien hinzu
          git add index.html
          git add *.txt 2>/dev/null || echo "Keine .txt Dateien gefunden zum Hinzufügen"
          
          # Nur committen und pushen, wenn sich wirklich was geändert hat
          if git diff --cached --quiet; then
            echo "Keine Änderungen festgestellt."
          else
            git commit -m "Auto-Update: Kickbase Daten & Dashboard aktualisiert [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
